<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Analyzer Tester</title>
<style>
:root{--bg:#f3f5f2;--panel:#fff;--ink:#1b2a26;--muted:#5d6b66;--line:#d5dcd8;--accent:#0f6b5c;--accent-ink:#fff;--err:#a3281f;--ok:#0f6b5c}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--panel:#1a2320;--ink:#e6eeea;--muted:#92a39c;--line:#2c3a35;--accent:#4fc2ac;--accent-ink:#0b1512;--err:#ff8b80;--ok:#4fc2ac}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px;font-family:system-ui,sans-serif;font-size:.95rem}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
label{display:block;font:600 .9rem system-ui,sans-serif;margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=text],input[type=file],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:.92rem system-ui,sans-serif}
textarea{min-height:170px;resize:vertical}
.hint{font:.8rem system-ui,sans-serif;color:var(--muted);margin-top:4px}
.mode{display:flex;gap:14px;font:.88rem system-ui,sans-serif;margin-top:8px}
.mode label{margin:0;font-weight:400;display:flex;gap:6px;align-items:center}
button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:600 1rem system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#status{font:.88rem system-ui,sans-serif;margin-bottom:12px;min-height:1.4em}
#status.err{color:var(--err)}#status.ok{color:var(--ok)}
#out{white-space:pre-wrap;word-wrap:break-word}
#out h2,#out h3{margin:1.2em 0 .3em;font-size:1.15rem}
#out h2:first-child,#out h3:first-child{margin-top:0}
#out ul{margin:.3em 0 .8em;padding-left:1.3em}
.empty{color:var(--muted);font-family:system-ui,sans-serif}
details{margin-top:16px;font:.85rem system-ui,sans-serif}
pre{overflow-x:auto;background:var(--bg);padding:10px;border-radius:6px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>CV Analyzer Tester</h1>
  <p class="sub">Upload a CV and paste a job description to run your n8n workflow.</p>
  <div class="grid">
    <div class="panel">
      <label for="url">Webhook URL</label>
      <input type="text" id="url" value="<input type="text" id="url" value="http://localhost:5678/webhook-test/cv-analyzer">
      <div class="mode">
        <label><input type="radio" name="m" value="webhook" checked> Production</label>
        <label><input type="radio" name="m" value="webhook-test"> Test (click “Listen for test event” first)</label>
      </div>
      <label for="cv">CV (PDF)</label>
      <input type="file" id="cv" accept="application/pdf">
      <label for="jd">Job description</label>
      <textarea id="jd" placeholder="Paste the job description here"></textarea>
      <button id="go">Analyze CV</button>
    </div>
    <div class="panel">
      <div id="status"></div>
      <div id="out"><span class="empty">The analysis will appear here.</span></div>
      <details id="rawBox" hidden><summary>Raw response</summary><pre id="raw"></pre></details>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const urlEl=$('url'),statusEl=$('status'),out=$('out'),go=$('go');

// switch between /webhook/ and /webhook-test/ in the URL
document.querySelectorAll('input[name=m]').forEach(r=>r.addEventListener('change',()=>{
  urlEl.value=urlEl.value.replace(/\/webhook(-test)?\//,'/'+r.value+'/');
}));

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function md(t){
  let h=esc(t).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?:^[ \t]*[-*] .*(?:\n|$))+/gm,b=>'<ul>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^[ \t]*[-*] /,'')+'</li>').join('')+'</ul>');
  return h;
}
function setStatus(m,c){statusEl.textContent=m;statusEl.className=c||''}

go.addEventListener('click',async()=>{
  const file=$('cv').files[0],jd=$('jd').value.trim();
  if(!file) return setStatus('Choose a PDF CV first.','err');
  if(!jd) return setStatus('Paste a job description first.','err');
  const fd=new FormData();
  fd.append('cv',file);            // matches binaryPropertyName "cv"
  fd.append('jobDescription',jd);  // matches body.jobDescription
  go.disabled=true;go.textContent='Analyzing…';
  setStatus('Sending to your workflow. This can take up to a minute.');
  out.innerHTML='';$('rawBox').hidden=true;
  try{
    const res=await fetch(urlEl.value.trim(),{method:'POST',body:fd});
    const text=await res.text();
    $('raw').textContent=text;$('rawBox').hidden=false;
    if(!res.ok) throw new Error('HTTP '+res.status+'. '+(res.status===404?'Webhook not found. For the test URL, click “Listen for test event” in n8n first; for production, activate the workflow.':text.slice(0,200)));
    let data;try{data=JSON.parse(text)}catch{throw new Error('Response was not JSON. See raw response below.')}
    if(!data.analysis) throw new Error('No “analysis” field in the response. See raw response below.');
    out.innerHTML=md(data.analysis);
    setStatus('Workflow responded successfully.','ok');
  }catch(e){
    const net=e instanceof TypeError;
    setStatus(net?'Could not reach the webhook. Check the URL, that n8n is running, and CORS (see below).':e.message,'err');
    if(net) out.innerHTML='<span class="empty">If you open this page from a file or another domain, set the Webhook node’s “Allowed Origins (CORS)” option to <code>*</code>, and make sure the URL is reachable from your browser. An https page cannot call an http URL.</span>';
  }finally{go.disabled=false;go.textContent='Analyze CV'}
});
</script>
</body>
</html>
